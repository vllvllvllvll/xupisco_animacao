<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="monospace">
  <rect x="0" y="0" width="1600" height="1180" fill="#ffffff"/>
  <!-- TITULO -->
  <g id="titulo">
    <text x="40" y="56" font-size="30" fill="#ff383c">XUPISCO_ANIMACAO — system design</text>
    <text x="40" y="82" font-size="14" fill="#555555">Vite + Three.js (vanilla) · rig PT-BR · 3 cameras · joystick + gamepad · timeline — arraste este SVG para dentro do Figma para editar</text>
    <rect x="40" y="96" width="220" height="22" fill="#d9d9d9"/>
    <text x="48" y="112" font-size="13" fill="#000000">cinza = modulo</text>
    <rect x="270" y="96" width="220" height="22" fill="#ff383c"/>
    <text x="278" y="112" font-size="13" fill="#ffffff">vermelho = controle / acao</text>
  </g>

  <!-- ARQUITETURA -->
  <g id="arquitetura">
    <text x="40" y="160" font-size="20" fill="#ff383c">1 · arquitetura</text>
    <rect x="40" y="175" width="180" height="60" fill="#d9d9d9"/>
    <text x="52" y="200" font-size="14" fill="#000000">index.html</text>
    <text x="52" y="220" font-size="11" fill="#333333">layout docked + UI</text>
    <rect x="260" y="175" width="180" height="60" fill="#d9d9d9"/>
    <text x="272" y="200" font-size="14" fill="#000000">src/main.js</text>
    <text x="272" y="220" font-size="11" fill="#333333">loop + IK + modos</text>
    <rect x="480" y="175" width="180" height="60" fill="#d9d9d9"/>
    <text x="492" y="200" font-size="14" fill="#000000">cena/palco.js</text>
    <text x="492" y="220" font-size="11" fill="#333333">1 renderer, scissor x3</text>
    <rect x="700" y="175" width="200" height="60" fill="#d9d9d9"/>
    <text x="712" y="200" font-size="14" fill="#000000">rig/personagem.js</text>
    <text x="712" y="220" font-size="11" fill="#333333">meshes + bones + ctrls</text>
    <rect x="940" y="175" width="200" height="60" fill="#d9d9d9"/>
    <text x="952" y="200" font-size="14" fill="#000000">controle/gamepad.js</text>
    <text x="952" y="220" font-size="11" fill="#333333">Gamepad API + virtual</text>
    <rect x="1180" y="175" width="180" height="60" fill="#d9d9d9"/>
    <text x="1192" y="200" font-size="14" fill="#000000">anim/timeline.js</text>
    <text x="1192" y="220" font-size="11" fill="#333333">keys + play + onion</text>
    <rect x="1400" y="175" width="160" height="60" fill="#ffffff" stroke="#999999" stroke-width="2"/>
    <text x="1412" y="200" font-size="14" fill="#000000">tests/ (34)</text>
    <text x="1412" y="220" font-size="11" fill="#333333">node:test + e2e</text>
    <line x1="220" y1="205" x2="260" y2="205" stroke="#ff383c" stroke-width="2"/>
    <polygon points="260,200 260,210 270,205" fill="#ff383c"/>
    <line x1="440" y1="205" x2="480" y2="205" stroke="#ff383c" stroke-width="2"/>
    <polygon points="480,200 480,210 490,205" fill="#ff383c"/>
  </g>

  <!-- VIEWPORTS -->
  <g id="viewports">
    <text x="40" y="285" font-size="20" fill="#ff383c">2 · viewports (1 canvas + scissor)</text>
    <rect x="40" y="300" width="300" height="220" fill="#ffffff" stroke="#999999" stroke-width="2"/>
    <text x="50" y="510" font-size="13" fill="#000000">Frontal (esq, 50%)</text>
    <rect x="340" y="300" width="300" height="105" fill="#ffffff" stroke="#999999" stroke-width="2"/>
    <text x="350" y="395" font-size="13" fill="#000000">Superior (dir-sup)</text>
    <rect x="340" y="415" width="300" height="105" fill="#ffffff" stroke="#999999" stroke-width="2"/>
    <text x="350" y="510" font-size="13" fill="#000000">Lateral (dir-inf)</text>
    <text x="680" y="330" font-size="13" fill="#333333">· frente: (x, y+0.35, z+4.4)</text>
    <text x="680" y="355" font-size="13" fill="#333333">· cima: (x, y+6.2, z) up=(0,0,-1)</text>
    <text x="680" y="380" font-size="13" fill="#333333">· lateral: (x+4.4, y+0.35, z)</text>
    <text x="680" y="405" font-size="13" fill="#333333">· lookAt na cintura todo frame</text>
    <text x="680" y="430" font-size="13" fill="#333333">· calcularViewports() = matematica pura</text>
  </g>

  <!-- RIG -->
  <g id="rig">
    <text x="40" y="575" font-size="20" fill="#ff383c">3 · rig (19 bones, raiz = cintura)</text>
    <text x="40" y="600" font-size="13" fill="#000000">cintura</text>
    <text x="70" y="622" font-size="13" fill="#000000">barriga → peito → pescoco → cabeca</text>
    <text x="70" y="644" font-size="13" fill="#000000">peito → ombro_E/D → braco → antebraco → mao (IK)</text>
    <text x="70" y="666" font-size="13" fill="#000000">cintura → coxa_E/D → perna → pe (IK)</text>
    <rect x="40" y="680" width="360" height="60" fill="#d9d9d9"/>
    <text x="52" y="704" font-size="13" fill="#000000">meshes: capsulas cinza / bone</text>
    <rect x="420" y="680" width="360" height="60" fill="#d9d9d9"/>
    <text x="432" y="704" font-size="13" fill="#000000">bones: THREE.Bone + SkeletonHelper</text>
    <rect x="800" y="680" width="400" height="60" fill="#ff383c"/>
    <text x="812" y="704" font-size="13" fill="#ffffff">controladores VERMELHOS: aneis, alvos IK, polos</text>
    <text x="40" y="762" font-size="13" fill="#333333">IK analitico 2 ossos (lei dos cossenos): origem + compA/compB + alvo + polo → junta media + alvo limitado</text>
  </g>

  <!-- GAMEPAD -->
  <g id="gamepad">
    <text x="40" y="810" font-size="20" fill="#ff383c">4 · gamepad + toques</text>
    <rect x="40" y="825" width="250" height="60" fill="#ff383c"/>
    <text x="52" y="849" font-size="13" fill="#ffffff">stick ESQ = move controlador</text>
    <rect x="310" y="825" width="250" height="60" fill="#ff383c"/>
    <text x="322" y="849" font-size="13" fill="#ffffff">stick DIR = so seleciona</text>
    <rect x="580" y="825" width="150" height="60" fill="#ff383c"/>
    <text x="592" y="849" font-size="13" fill="#ffffff">L1 = cicla X→Y→Z</text>
    <rect x="750" y="825" width="170" height="60" fill="#ff383c"/>
    <text x="762" y="849" font-size="13" fill="#ffffff">R1 = confirma (modo)</text>
    <text x="40" y="915" font-size="14" fill="#000000">selecao —R1→ mover —R1→ selecao · eixos Blender X/Y/Z · so controladores (9), sem bones</text>
    <text x="40" y="940" font-size="13" fill="#333333">marcha procedural pausa o Y da cintura quando o usuario move a cintura no modo mover</text>
  </g>

  <!-- TIMELINE -->
  <g id="timeline">
    <text x="40" y="988" font-size="20" fill="#ff383c">5 · timeline</text>
    <rect x="40" y="1003" width="130" height="40" fill="#d9d9d9"/>
    <text x="52" y="1028" font-size="13" fill="#000000">● key (salva pose)</text>
    <rect x="180" y="1003" width="90" height="40" fill="#d9d9d9"/>
    <text x="192" y="1028" font-size="13" fill="#000000">▶ play loop</text>
    <rect x="280" y="1003" width="150" height="40" fill="#d9d9d9"/>
    <text x="292" y="1028" font-size="13" fill="#000000">fps 12/24/30/60</text>
    <rect x="440" y="1003" width="260" height="40" fill="#ff383c"/>
    <text x="452" y="1028" font-size="13" fill="#ffffff">onion: key anterior + proxima</text>
    <text x="40" y="1070" font-size="13" fill="#333333">play aplica keys interpoladas e pausa IK/marcha · click no chip pula p/ a key · limpar zera</text>
    <text x="40" y="1110" font-size="13" fill="#555555">testes: node:test (36) + E2E gamepad fake (9 ctrls × sel/confirma/move x,y,z) · deploy: vercel --prod</text>
  </g>
</svg>
